# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

# Per pull request and push to main — four builds: macOS and Windows (where the products ship), Linux gcc 14,
# and ASan + UBSan; plus core's lints, which compile nothing. Nightly, and only if this repository or
# felitronics-core changed in the last day: the suite against core's current main, arm64 Linux (poweramp
# alone — the row that once found poweramp reading 1.26e-08 out of silence under gcc's FP contraction), and
# poweramp under wasm. felitronics-core is fetched at FELITRONICS_GUITAR_FCORE_TAG (CMakeLists.txt).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One live run per pull request: a new push cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: ${{ matrix.os }} pffft=${{ matrix.pffft }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   pffft: ON  }
          - { os: windows-latest, pffft: OFF }   # as core's Windows row
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_GUITAR_BUILD_TESTS=ON -DFELITRONICS_WITH_PFFFT=${{ matrix.pffft }}
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error -j 4

  gcc14:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: ubuntu-gcc-14
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install g++-14
        run: sudo apt-get update && sudo apt-get install -y g++-14
      - name: Configure
        env: { CXX: g++-14, CC: gcc-14 }
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_GUITAR_BUILD_TESTS=ON -DFELITRONICS_WITH_PFFFT=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j 4

  sanitizers:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: ubuntu-clang-asan-ubsan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure (ASan + UBSan, hard-fail on any UB)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER=clang
          -DFELITRONICS_GUITAR_BUILD_TESTS=ON -DFELITRONICS_ENABLE_SANITIZERS=ON -DFELITRONICS_WITH_PFFFT=ON
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j "$(nproc)"

  lints:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: lints (core's, run from this root)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Fetch core (configure only)
        run: cmake -S . -B build -DFELITRONICS_GUITAR_BUILD_TESTS=OFF -DFELITRONICS_GUITAR_WITH_NAM=OFF
      - name: det-math manifest
        run: node build/_deps/felitronics_core-src/tools/lint/check-det-math.mjs --satellite
      - name: One allocation counter
        run: node build/_deps/felitronics_core-src/tools/lint/check-alloc-counter.mjs modules tests
      - name: No long double
        run: node build/_deps/felitronics_core-src/tools/lint/check-no-long-double.mjs modules tests

  # ---- nightly -------------------------------------------------------------------------------------------
  changed:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: anything new since yesterday?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any: ${{ steps.look.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '25 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          here=$(git log --since="$since" --oneline | wc -l)
          core=$(gh api "repos/darwinscat/felitronics-core/commits?sha=main&since=$since&per_page=1" --jq length)
          echo "since $since: $here commit(s) here, $core in felitronics-core main"
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ "$here" -gt 0 ] || [ "$core" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

  core-main:
    needs: changed
    if: needs.changed.outputs.any == 'true'
    name: against felitronics-core main
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_GUITAR_BUILD_TESTS=ON -DFELITRONICS_WITH_PFFFT=ON -DFELITRONICS_GUITAR_FCORE_TAG=main
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j 4

  arm64:
    needs: changed
    if: needs.changed.outputs.any == 'true'
    name: ubuntu-24.04-arm (poweramp)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_GUITAR_BUILD_TESTS=ON -DFELITRONICS_GUITAR_WITH_NAM=OFF
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error -j 4

  wasm-audio:
    needs: changed
    if: needs.changed.outputs.any == 'true'
    name: wasm-audio (poweramp)
    # NAM is outside the wasm tier (its upstream sources throw), so this builds poweramp alone, with core's
    # wasm-audio preset flags and toolchain pin.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install emsdk 6.0.9
        run: |
          git clone --depth 1 --branch 6.0.9 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install 6.0.9
          "$HOME/emsdk/emsdk" activate 6.0.9
          source "$HOME/emsdk/emsdk_env.sh"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          echo "PATH=$PATH"   >> "$GITHUB_ENV"
      - name: Configure + build
        run: |
          cmake -S . -B build-wasm -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
                -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_GUITAR_WITH_NAM=OFF -DFELITRONICS_GUITAR_BUILD_TESTS=ON \
                "-DCMAKE_CXX_FLAGS=-fno-exceptions -fno-rtti -ffp-contract=off -msimd128"
          cmake --build build-wasm -j "$(nproc)"
      - name: Run the suite in node
        run: ctest --test-dir build-wasm --output-on-failure --no-tests=error -j "$(nproc)"
      - name: No threads in any emitted .wasm
        run: node build-wasm/_deps/felitronics_core-src/tools/wasm/check-no-threads.mjs --all build-wasm
      - name: No threading header in a public module header
        run: |
          if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(thread|mutex|shared_mutex|condition_variable|future|latch|barrier|semaphore|stop_token)>' modules/poweramp/include; then
            echo "^^ the wasm-audio tier is single-threaded by contract (felitronics-core DSP-ARCHITECTURE.md 2)"; exit 1
          fi
      - name: No long double arithmetic in any emitted object — law 9
        run: |
          NM="$EMSDK/upstream/bin/llvm-nm"
          if find build-wasm -name '*.o' -print0 \
             | xargs -0 "$NM" --undefined-only --print-file-name \
             | grep -E ' U (__(add|sub|mul|div|neg|extend[sd]f|trunc|fix|float|eq|ne|lt|le|gt|ge|unord)tf[0-9a-z]*|(sqrt|pow|exp|log|sin|cos|tan|fabs|floor|ceil|fmod|hypot|fma)l)$'; then
            echo "^^ a wasm32 long double operation is a compiler-rt libcall — law 9."; exit 1
          fi
      - name: Checked build — SAFE_HEAP + assertions + stack-overflow checks
        run: |
          cmake -S . -B build-wasm-checked -DCMAKE_TOOLCHAIN_FILE="$EMSDK/upstream/emscripten/cmake/Modules/Platform/Emscripten.cmake" \
                -DCMAKE_BUILD_TYPE=Release -DFELITRONICS_GUITAR_WITH_NAM=OFF -DFELITRONICS_GUITAR_BUILD_TESTS=ON \
                "-DCMAKE_CXX_FLAGS=-fno-exceptions -fno-rtti -ffp-contract=off -msimd128" \
                -DFELITRONICS_WASM_ASSERTIONS=2 -DCMAKE_EXE_LINKER_FLAGS="-sSAFE_HEAP=1 -sSTACK_OVERFLOW_CHECK=2"
          cmake --build build-wasm-checked -j "$(nproc)"
          ctest --test-dir build-wasm-checked --output-on-failure --no-tests=error -j "$(nproc)"
