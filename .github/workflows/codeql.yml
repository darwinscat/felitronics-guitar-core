# SPDX-License-Identifier: AGPL-3.0-or-later
name: codeql

# Weekly, as in felitronics-core, whose CodeQL build covered poweramp until it moved here.
on:
  schedule:
    - cron: "33 3 * * 1"   # weekly, Monday
  workflow_dispatch:

jobs:
  analyze:
    name: CodeQL (C++)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.38.0
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build the tests (compiles all headers)
        run: |
          cmake -S . -B build -DFELITRONICS_GUITAR_BUILD_TESTS=ON
          cmake --build build -j 4
      - uses: github/codeql-action/analyze@v4.38.0
        with:
          category: "/language:c-cpp"
